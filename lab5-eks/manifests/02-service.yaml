# Exposes the Deployment on the internet through an AWS load balancer.
# The selector is how a Service finds its Pods: every Pod carrying the label app=mission-control
# becomes an endpoint. Break the selector (Challenge D) and the Service has nobody to send traffic to.
apiVersion: v1
kind: Service
metadata:
  name: mission-control
  labels: { app: mission-control }
spec:
  type: LoadBalancer                  # ask AWS for a load balancer (ECS: ALB + target group)
  selector: { app: mission-control }  # send traffic to Pods with this label
  ports:
    - port: 80
      targetPort: 8080
