# Challenge F: a smoke test as a Job. A Job runs to completion; its exit code is the verdict.
# This is the Kubernetes version of Lab 2's ValidateService hook: a pipeline would apply it after
# `kubectl rollout status` and wait for it with `kubectl wait --for=condition=complete`.
apiVersion: batch/v1
kind: Job
metadata:
  name: smoke-test
spec:
  backoffLimit: 1                    # retry once, then mark the Job Failed
  ttlSecondsAfterFinished: 600       # tidy up ten minutes after it finishes
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: check
          image: public.ecr.aws/docker/library/busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "1/3 liveness";   wget -qO- http://mission-control/health   | grep -q '"status":"ok"'
              echo "2/3 readiness";  wget -qO- http://mission-control/ready    | grep -q '"ready":true'
              echo "3/3 version";    wget -qO- http://mission-control/api/info | grep -o '"version":"[^"]*"'
              echo "smoke test passed"
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 64Mi }
