# Challenge: hammer the service from inside the cluster so the HPA has something to react to.
apiVersion: v1
kind: Pod
metadata:
  name: load-generator
spec:
  restartPolicy: Never
  containers:
    - name: hey
      image: public.ecr.aws/docker/library/busybox:1.36
      command: ["/bin/sh", "-c", "while true; do wget -q -O- http://mission-control/ >/dev/null; done"]
      resources:
        requests: { cpu: 50m, memory: 32Mi }
        limits:   { cpu: 200m, memory: 64Mi }
