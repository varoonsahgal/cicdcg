<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pipeline Repair Shop</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; background: #052e16; color: #ecfdf5;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: #14532d; padding: 48px 56px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.45); text-align: center; max-width: 560px; }
    h1 { margin: 0 0 8px; font-size: 38px; color: #4ade80; }
    p { margin: 6px 0; color: #bbf7d0; }
    .badge { display: inline-block; margin: 18px 6px 0; padding: 6px 14px; border-radius: 999px; background: #22c55e; color: #052e16; font-weight: 700; }
    code { background: #052e16; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>You fixed the pipeline!</h1>
    <p>This page travelled: <code>S3</code> &rarr; <code>CodePipeline</code> &rarr; <code>CodeBuild</code> &rarr; <code>CodeDeploy</code> &rarr; <code>EC2</code>.</p>
    <p>Every stage had to be green for you to read this sentence.</p>
    <span class="badge">Build #__BUILD_ID__</span>
    <span class="badge">__BUILD_TIME__</span>
  </div>
</body>
</html>
