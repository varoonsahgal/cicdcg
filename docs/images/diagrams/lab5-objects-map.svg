<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs>
  <rect width="960" height="560" rx="18" fill="#0B1220"/>
  <text x="32" y="40" fill="#E2E8F0" font-size="20" font-weight="700">Your namespace, as Kubernetes sees it</text>
  <text x="32" y="60" fill="#94A3B8" font-size="12.5">Solid = Part 3 · dashed = challenges. Arrows point from the object that is read to the object that reads it.</text>
  <rect x="24" y="76" width="912" height="446" rx="16" fill="none" stroke="#A78BFA" stroke-dasharray="6 5" stroke-width="1.5"/>
  <text x="40" y="98" fill="#C4B5FD" font-size="12" font-weight="700">namespace participant-NN</text>
  <text x="212" y="98" fill="#94A3B8" font-size="10.5">ResourceQuota lab-quota: 12 pods · 2 LBs · 2 CPU · 3 GiB of requests   ·   LimitRange lab-defaults: 100m/128Mi requests, 250m/256Mi limits by default</text>
  <g font-size="11">
    <!-- config column -->
    <g transform="translate(44,118)"><rect width="214" height="104" rx="12" fill="#1E293B" stroke="#22C55E" stroke-width="2"/><text x="14" y="22" fill="#86EFAC" font-size="12.5" font-weight="700">ConfigMap mission-control</text><text x="14" y="44" fill="#CBD5E1">MISSION_NAME · APP_COLOR</text><text x="14" y="58" fill="#94A3B8">→ env vars, copied at start</text><text x="14" y="80" fill="#CBD5E1">motd</text><text x="14" y="94" fill="#94A3B8">→ file motd.txt, kept in sync</text></g>
    <g transform="translate(44,244)"><rect width="214" height="70" rx="12" fill="#1E293B" stroke="#22C55E" stroke-width="2" stroke-dasharray="5 4"/><text x="14" y="22" fill="#86EFAC" font-size="12.5" font-weight="700">Secret mission-secret</text><text x="14" y="44" fill="#CBD5E1">LAUNCH_CODE (base64 ≠ encrypted)</text><text x="14" y="58" fill="#94A3B8">→ env var · Challenge H</text></g>
    <g transform="translate(44,336)"><rect width="214" height="70" rx="12" fill="#1E293B" stroke="#C4B5FD" stroke-width="2" stroke-dasharray="5 4"/><text x="14" y="22" fill="#C4B5FD" font-size="12.5" font-weight="700">HPA mission-control</text><text x="14" y="44" fill="#CBD5E1">2–6 replicas, target 50 % CPU</text><text x="14" y="58" fill="#94A3B8">→ sets Deployment replicas · A</text></g>
    <g transform="translate(44,428)"><rect width="214" height="70" rx="12" fill="#1E293B" stroke="#C4B5FD" stroke-width="2" stroke-dasharray="5 4"/><text x="14" y="22" fill="#C4B5FD" font-size="12.5" font-weight="700">PodDisruptionBudget</text><text x="14" y="44" fill="#CBD5E1">minAvailable 1</text><text x="14" y="58" fill="#94A3B8">→ protects Pods during drains · I</text></g>
    <!-- workload column -->
    <g transform="translate(292,118)"><rect width="320" height="62" rx="12" fill="#1E293B" stroke="#A78BFA" stroke-width="2"/><text x="14" y="22" fill="#C4B5FD" font-size="12.5" font-weight="700">Deployment mission-control</text><text x="14" y="40" fill="#CBD5E1" font-size="10.5">replicas 2 · RollingUpdate maxSurge 1 / maxUnavailable 0</text><text x="14" y="54" fill="#94A3B8" font-size="10.5">progressDeadlineSeconds 120 · revision history for undo</text></g>
    <g transform="translate(292,204)"><rect width="320" height="44" rx="12" fill="#1E293B" stroke="#A78BFA" stroke-width="2"/><text x="14" y="20" fill="#C4B5FD" font-size="12.5" font-weight="700">ReplicaSet mission-control-7848469d98</text><text x="14" y="36" fill="#94A3B8" font-size="10.5">one per pod-template hash; old ones kept at 0 replicas</text></g>
    <g transform="translate(292,272)"><rect width="152" height="150" rx="12" fill="#1E293B" stroke="#A78BFA" stroke-width="2"/><text x="12" y="20" fill="#C4B5FD" font-size="12" font-weight="700">Pod …-r2rhq</text><text x="12" y="38" fill="#94A3B8" font-size="10.5">label app=mission-control</text><rect x="12" y="48" width="128" height="90" rx="8" fill="#0F172A" stroke="#475569"/><text x="76" y="66" fill="#E2E8F0" text-anchor="middle" font-weight="700">container web :8080</text><text x="76" y="84" fill="#86EFAC" text-anchor="middle" font-size="10.5">readiness GET /ready</text><text x="76" y="98" fill="#FCD34D" text-anchor="middle" font-size="10.5">liveness GET /health</text><text x="76" y="116" fill="#94A3B8" text-anchor="middle" font-size="10">req 100m / 128Mi</text><text x="76" y="129" fill="#94A3B8" text-anchor="middle" font-size="10">lim 250m / 256Mi</text></g>
    <g transform="translate(460,272)"><rect width="152" height="150" rx="12" fill="#1E293B" stroke="#A78BFA" stroke-width="2"/><text x="12" y="20" fill="#C4B5FD" font-size="12" font-weight="700">Pod …-wkkb5</text><text x="12" y="38" fill="#94A3B8" font-size="10.5">on the other node</text><rect x="12" y="48" width="128" height="90" rx="8" fill="#0F172A" stroke="#475569"/><text x="76" y="66" fill="#E2E8F0" text-anchor="middle" font-weight="700">container web :8080</text><text x="76" y="84" fill="#86EFAC" text-anchor="middle" font-size="10.5">readiness GET /ready</text><text x="76" y="98" fill="#FCD34D" text-anchor="middle" font-size="10.5">liveness GET /health</text><text x="76" y="116" fill="#94A3B8" text-anchor="middle" font-size="10">same image, same spec</text><text x="76" y="129" fill="#94A3B8" text-anchor="middle" font-size="10">own hostname, own counter</text></g>
    <g transform="translate(292,446)"><rect width="320" height="52" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5 4"/><text x="14" y="20" fill="#FCD34D" font-size="12.5" font-weight="700">Job smoke-test · Pod load-generator</text><text x="14" y="38" fill="#94A3B8" font-size="10.5">run to completion / hammer the Service · F and A</text></g>
    <!-- traffic column -->
    <g transform="translate(640,118)"><rect width="276" height="62" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/><text x="14" y="22" fill="#7DD3FC" font-size="12.5" font-weight="700">AWS load balancer (created for you)</text><text x="14" y="40" fill="#CBD5E1" font-size="10.5">a2e7…-2085589031.us-west-2.elb.amazonaws.com</text><text x="14" y="54" fill="#94A3B8" font-size="10.5">:80 → the nodes → the Service</text></g>
    <g transform="translate(640,204)"><rect width="276" height="88" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/><text x="14" y="22" fill="#7DD3FC" font-size="12.5" font-weight="700">Service mission-control</text><text x="14" y="40" fill="#CBD5E1" font-size="10.5">type LoadBalancer · port 80 → targetPort 8080</text><text x="14" y="56" fill="#CBD5E1" font-size="10.5">selector app=mission-control</text><text x="14" y="76" fill="#94A3B8" font-size="10.5">in-cluster DNS: mission-control.participant-NN.svc</text></g>
    <g transform="translate(640,316)"><rect width="276" height="60" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/><text x="14" y="22" fill="#7DD3FC" font-size="12.5" font-weight="700">Endpoints mission-control</text><text x="14" y="40" fill="#CBD5E1" font-size="10.5">172.31.60.107:8080 · 172.31.40.173:8080</text><text x="14" y="54" fill="#94A3B8" font-size="10.5">READY Pods only; break the selector → empty</text></g>
    <g transform="translate(640,400)"><rect width="276" height="98" rx="12" fill="#0F172A" stroke="#334155"/><text x="14" y="22" fill="#E2E8F0" font-size="12.5" font-weight="700">What is NOT in your namespace</text><text x="14" y="42" fill="#CBD5E1">Nodes (2 × t3.large, shared) · kube-system</text><text x="14" y="58" fill="#CBD5E1">the metrics-server · CoreDNS · the VPC CNI</text><text x="14" y="78" fill="#94A3B8">You may look at nodes (ClusterRole viewer)</text><text x="14" y="92" fill="#94A3B8">and at nothing else outside the dashed line.</text></g>
  </g>
  <g stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M452 180V202"/><path d="M452 248V270"/><path d="M536 248V270"/>
    <path d="M258 170 C276 170, 276 300, 290 300"/><path d="M258 200 C276 200, 276 330, 290 330"/>
    <path d="M258 279 C276 279, 276 360, 290 360"/>
    <path d="M258 371 C276 371, 276 150, 290 150"/>
    <path d="M778 180V202"/><path d="M778 292V314"/>
    <path d="M638 346H614"/>
  </g>
  <text x="276" y="296" fill="#94A3B8" font-size="9" text-anchor="middle">env</text><text x="276" y="326" fill="#94A3B8" font-size="9" text-anchor="middle">file</text>
  <text x="32" y="546" fill="#64748B" font-size="11.5">kubectl get all,cm,secret,hpa,pdb,endpoints shows every box above; kubectl describe &lt;kind&gt; &lt;name&gt; shows the arrows, and the Events that explain a missing one.</text>
</svg>
