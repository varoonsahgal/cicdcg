<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker>
        <marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FACC15"/></marker></defs>
  <rect width="960" height="520" rx="18" fill="#0B1220"/>
  <text x="32" y="42" fill="#E2E8F0" font-size="20" font-weight="700">The plumbing behind ECS blue/green, canary and linear</text>
  <text x="32" y="64" fill="#94A3B8" font-size="13">You build it once (Part 2). On every deployment ECS rewrites the two listener rules' weights for you.</text>

  <!-- users -->
  <rect x="32" y="130" width="130" height="56" rx="12" fill="#1E293B" stroke="#334155"/><text x="97" y="155" fill="#E2E8F0" font-size="13" text-anchor="middle" font-weight="700">Customers</text><text x="97" y="173" fill="#94A3B8" font-size="11" text-anchor="middle">port 80</text>
  <rect x="32" y="300" width="130" height="56" rx="12" fill="#1E293B" stroke="#FACC15"/><text x="97" y="325" fill="#FDE047" font-size="13" text-anchor="middle" font-weight="700">Testers / hooks</text><text x="97" y="343" fill="#94A3B8" font-size="11" text-anchor="middle">port 8080</text>

  <!-- ALB -->
  <rect x="200" y="96" width="330" height="300" rx="16" fill="#111827" stroke="#334155"/>
  <text x="216" y="120" fill="#E2E8F0" font-size="13" font-weight="700">Application Load Balancer  ·  participant-NN-pizza-alb</text>
  <rect x="216" y="134" width="298" height="70" rx="10" fill="#1E293B" stroke="#475569"/>
  <text x="230" y="156" fill="#E2E8F0" font-size="12.5" font-weight="700">Listener :80 · production rule</text>
  <text x="230" y="176" fill="#94A3B8" font-size="11">path /* → forward, weighted</text>
  <text x="230" y="194" fill="#86EFAC" font-size="11" font-family="ui-monospace,Menlo,monospace">blue 100 · green 0  → 90/10 → 0/100</text>
  <rect x="216" y="290" width="298" height="70" rx="10" fill="#1E293B" stroke="#FACC15"/>
  <text x="230" y="312" fill="#FDE047" font-size="12.5" font-weight="700">Listener :8080 · test rule</text>
  <text x="230" y="332" fill="#94A3B8" font-size="11">path /* → whichever revision is NEW</text>
  <text x="230" y="350" fill="#FDE047" font-size="11" font-family="ui-monospace,Menlo,monospace">green 100 during the test window</text>
  <text x="216" y="232" fill="#64748B" font-size="11">default actions: fixed 404 "no route"</text>
  <text x="216" y="250" fill="#64748B" font-size="11">SG: 80 + 8080 in · tasks accept 8080 only from here</text>

  <line x1="162" y1="158" x2="214" y2="164" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="162" y1="328" x2="214" y2="324" stroke="#FACC15" stroke-width="2" marker-end="url(#y)"/>

  <!-- target groups -->
  <rect x="580" y="110" width="170" height="96" rx="12" fill="#1E293B" stroke="#A855F7"/>
  <text x="596" y="134" fill="#E2E8F0" font-size="13" font-weight="700">TG  pizza-blue</text>
  <text x="596" y="154" fill="#94A3B8" font-size="11">IP targets · /health</text>
  <g font-size="10" font-weight="700" text-anchor="middle"><rect x="596" y="166" width="38" height="26" rx="6" fill="#A855F7"/><text x="615" y="183" fill="#0B1220">1.1</text><rect x="640" y="166" width="38" height="26" rx="6" fill="#A855F7"/><text x="659" y="183" fill="#0B1220">1.1</text><rect x="684" y="166" width="38" height="26" rx="6" fill="#A855F7"/><text x="703" y="183" fill="#0B1220">1.1</text></g>
  <rect x="580" y="290" width="170" height="96" rx="12" fill="#1E293B" stroke="#06B6D4"/>
  <text x="596" y="314" fill="#E2E8F0" font-size="13" font-weight="700">TG  pizza-green</text>
  <text x="596" y="334" fill="#94A3B8" font-size="11">IP targets · /health</text>
  <g font-size="10" font-weight="700" text-anchor="middle"><rect x="596" y="346" width="38" height="26" rx="6" fill="#06B6D4"/><text x="615" y="363" fill="#0B1220">1.2</text><rect x="640" y="346" width="38" height="26" rx="6" fill="#06B6D4"/><text x="659" y="363" fill="#0B1220">1.2</text><rect x="684" y="346" width="38" height="26" rx="6" fill="#06B6D4"/><text x="703" y="363" fill="#0B1220">1.2</text></g>

  <line x1="514" y1="166" x2="578" y2="158" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="514" y1="184" x2="578" y2="320" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a)"/>
  <line x1="514" y1="324" x2="578" y2="334" stroke="#FACC15" stroke-width="2" marker-end="url(#y)"/>

  <!-- ECS -->
  <rect x="790" y="110" width="140" height="276" rx="14" fill="#111827" stroke="#334155"/>
  <text x="860" y="136" fill="#E2E8F0" font-size="13" text-anchor="middle" font-weight="700">ECS service</text>
  <text x="860" y="154" fill="#94A3B8" font-size="11" text-anchor="middle">participant-NN-pizza-svc</text>
  <text x="860" y="188" fill="#C4B5FD" font-size="11.5" text-anchor="middle">blue revision</text><text x="860" y="204" fill="#94A3B8" font-size="10.5" text-anchor="middle">"source"</text>
  <text x="860" y="338" fill="#67E8F9" font-size="11.5" text-anchor="middle">green revision</text><text x="860" y="354" fill="#94A3B8" font-size="10.5" text-anchor="middle">"target"</text>
  <line x1="788" y1="196" x2="752" y2="180" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="788" y1="344" x2="752" y2="360" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="860" y="250" fill="#64748B" font-size="10.5" text-anchor="middle">registers tasks</text><text x="860" y="265" fill="#64748B" font-size="10.5" text-anchor="middle">in the right TG</text>

  <!-- infra role -->
  <rect x="200" y="420" width="730" height="72" rx="14" fill="#1E293B" stroke="#334155"/>
  <text x="216" y="446" fill="#E2E8F0" font-size="13" font-weight="700">participant-NN-ecs-infra-role</text>
  <text x="216" y="466" fill="#94A3B8" font-size="11.5">trust: ecs.amazonaws.com · AmazonECSInfrastructureRolePolicyForLoadBalancers · Part 6 adds lambda:InvokeFunction</text>
  <text x="216" y="484" fill="#94A3B8" font-size="11.5">The identity ECS uses to edit YOUR listener rules. Without it, ECS cannot move a single request.</text>
  <text x="928" y="406" fill="#64748B" font-size="10.5" text-anchor="end">blue and green swap roles every deployment</text>
</svg>
