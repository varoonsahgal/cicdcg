<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs>
  <rect width="960" height="330" rx="18" fill="#0B1220"/>
  <text x="32" y="42" fill="#E2E8F0" font-size="20" font-weight="700">One in-place deployment, step by step (the CodeDeploy agent runs this on each server)</text>
  <g font-size="12" text-anchor="middle">
    <g transform="translate(32,80)"><rect width="118" height="78" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/><text x="59" y="24" fill="#FCD34D" font-weight="700">ApplicationStop</text><text x="59" y="44" fill="#94A3B8" font-size="11">stop the OLD version</text><text x="59" y="60" fill="#94A3B8" font-size="11">(uses old scripts!)</text></g>
    <g transform="translate(164,80)"><rect width="118" height="78" rx="12" fill="#1E293B" stroke="#334155"/><text x="59" y="24" fill="#E2E8F0" font-weight="700">DownloadBundle</text><text x="59" y="44" fill="#94A3B8" font-size="11">fetch the zip from S3</text><text x="59" y="60" fill="#FCA5A5" font-size="11">needs instance role ✔</text></g>
    <g transform="translate(296,80)"><rect width="118" height="78" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/><text x="59" y="24" fill="#FCD34D" font-weight="700">BeforeInstall</text><text x="59" y="44" fill="#94A3B8" font-size="10">install_dependencies</text><text x="59" y="60" fill="#94A3B8" font-size="11">dnf install httpd</text></g>
    <g transform="translate(428,80)"><rect width="118" height="78" rx="12" fill="#1E293B" stroke="#334155"/><text x="59" y="24" fill="#E2E8F0" font-weight="700">Install</text><text x="59" y="44" fill="#94A3B8" font-size="11">copy files: section</text><text x="59" y="60" fill="#94A3B8" font-size="11">→ /var/www/html</text></g>
    <g transform="translate(560,80)"><rect width="118" height="78" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/><text x="59" y="24" fill="#FCD34D" font-weight="700">AfterInstall</text><text x="59" y="44" fill="#94A3B8" font-size="11">(unused in Lab 2)</text></g>
    <g transform="translate(692,80)"><rect width="118" height="78" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/><text x="59" y="24" fill="#FCD34D" font-weight="700">ApplicationStart</text><text x="59" y="44" fill="#94A3B8" font-size="11">start_server.sh</text><text x="59" y="60" fill="#94A3B8" font-size="11">systemctl start httpd</text></g>
    <g transform="translate(824,80)"><rect width="118" height="78" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/><text x="59" y="24" fill="#FCD34D" font-weight="700">ValidateService</text><text x="59" y="44" fill="#94A3B8" font-size="11">prove it works</text><text x="59" y="60" fill="#86EFAC" font-size="11">curl localhost | grep</text></g>
  </g>
  <g stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M150 119H162"/><path d="M282 119H294"/><path d="M414 119H426"/><path d="M546 119H558"/><path d="M678 119H690"/><path d="M810 119H822"/></g>
  <g font-size="12" fill="#CBD5E1"><text x="32" y="200">🟧 orange = a <tspan fill="#FCD34D" font-weight="700">hook</tspan>: your script runs; exit code 0 = continue, anything else = the deployment fails right here.</text>
  <text x="32" y="224">⬜ grey = CodeDeploy's own work. <tspan fill="#FCA5A5">DownloadBundle</tspan> is where missing S3 permission shows up.</text>
  <text x="32" y="248">⚠️ A failure in <tspan fill="#FCD34D">ApplicationStart</tspan> happens <tspan font-weight="700">after</tspan> ApplicationStop already stopped the old version: without rollback, the site is down.</text>
  <text x="32" y="272">↩️ With <tspan font-weight="700">automatic rollback</tspan> on, a failure triggers a brand-new deployment of the last revision that succeeded.</text>
  <text x="32" y="300" fill="#64748B">Blue/green deployments avoid the gap entirely by starting the new version on new servers first. (Not covered in this lab.)</text></g>
</svg>
