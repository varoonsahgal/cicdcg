<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="960" height="430" rx="18" fill="#0B1220"/>
  <text x="32" y="42" fill="#E2E8F0" font-size="20" font-weight="700">One ECS deployment, stage by stage, and where you can hook in</text>
  <text x="32" y="64" fill="#94A3B8" font-size="13">Times measured in the class account (3 tasks, 0.25 vCPU each). Your times will be close.</text>

  <line x1="50" y1="180" x2="910" y2="180" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <g font-size="11" text-anchor="middle">
    <!-- stage dots -->
    <circle cx="70" cy="180" r="9" fill="#64748B"/><text x="70" y="146" fill="#E2E8F0" font-weight="700">PRE_SCALE_UP</text><text x="70" y="214" fill="#94A3B8">blue has 100 %</text>
    <circle cx="190" cy="180" r="9" fill="#06B6D4"/><text x="190" y="112" fill="#E2E8F0" font-weight="700">SCALE_UP</text><text x="190" y="214" fill="#94A3B8">green tasks start</text><text x="190" y="230" fill="#64748B">≈ 60–90 s</text>
    <circle cx="300" cy="180" r="9" fill="#64748B"/><text x="300" y="146" fill="#E2E8F0" font-weight="700">POST_SCALE_UP</text><text x="300" y="214" fill="#94A3B8">green healthy, idle</text>
    <circle cx="420" cy="180" r="9" fill="#FACC15"/><text x="420" y="112" fill="#FDE047" font-weight="700">TEST_TRAFFIC_SHIFT</text><text x="420" y="128" fill="#94A3B8">≈ 25 s</text><text x="420" y="214" fill="#94A3B8">:8080 → green</text>
    <circle cx="540" cy="180" r="11" fill="#FACC15" stroke="#FDE047" stroke-width="3"/><text x="540" y="146" fill="#FDE047" font-weight="700">POST_TEST_TRAFFIC_SHIFT</text><text x="540" y="214" fill="#94A3B8">customers still on blue</text>
    <circle cx="665" cy="180" r="9" fill="#22C55E"/><text x="665" y="112" fill="#86EFAC" font-weight="700">PRODUCTION_TRAFFIC_SHIFT</text><text x="665" y="128" fill="#94A3B8">≈ 25 s, or canary/linear steps</text><text x="665" y="214" fill="#94A3B8">:80 weights move</text>
    <circle cx="785" cy="180" r="9" fill="#38BDF8"/><text x="785" y="146" fill="#7DD3FC" font-weight="700">BAKE_TIME</text><text x="785" y="214" fill="#94A3B8">blue kept warm</text><text x="785" y="230" fill="#64748B">bakeTimeInMinutes</text>
    <circle cx="895" cy="180" r="9" fill="#64748B"/><text x="895" y="112" fill="#E2E8F0" font-weight="700">CLEAN_UP</text><text x="895" y="214" fill="#94A3B8">blue stopped</text><text x="895" y="246" fill="#64748B">SIGTERM in logs</text>
  </g>

  <!-- hooks -->
  <rect x="440" y="262" width="200" height="60" rx="12" fill="#1E293B" stroke="#FACC15"/>
  <text x="540" y="284" fill="#FDE047" font-size="12.5" text-anchor="middle" font-weight="700">Part 4 · PAUSE hook</text>
  <text x="540" y="302" fill="#94A3B8" font-size="11" text-anchor="middle">a human tests :8080, then</text>
  <text x="540" y="316" fill="#94A3B8" font-size="11" text-anchor="middle">continue-service-deployment</text>
  <rect x="440" y="334" width="200" height="60" rx="12" fill="#1E293B" stroke="#FACC15"/>
  <text x="540" y="356" fill="#FDE047" font-size="12.5" text-anchor="middle" font-weight="700">Part 6 · Lambda hook</text>
  <text x="540" y="374" fill="#94A3B8" font-size="11" text-anchor="middle">menu-walker orders every pizza;</text>
  <text x="540" y="388" fill="#94A3B8" font-size="11" text-anchor="middle">FAILED → rollback, 0 customers hit</text>
  <line x1="540" y1="194" x2="540" y2="260" stroke="#FACC15" stroke-dasharray="4 4"/>

  <rect x="660" y="262" width="270" height="132" rx="12" fill="#1E293B" stroke="#EF4444"/>
  <text x="676" y="284" fill="#FCA5A5" font-size="12.5" font-weight="700">Part 5 · CloudWatch alarm on 5xx</text>
  <text x="676" y="304" fill="#94A3B8" font-size="11">watched from production shift to the end of bake</text>
  <text x="676" y="322" fill="#94A3B8" font-size="11">ALARM → ECS rolls back by itself</text>
  <text x="676" y="346" fill="#FCA5A5" font-size="12.5" font-weight="700">Any time · you</text>
  <text x="676" y="366" fill="#94A3B8" font-size="11" font-family="ui-monospace,Menlo,monospace">stop-service-deployment … ROLLBACK</text>
  <text x="676" y="382" fill="#94A3B8" font-size="11">during bake: traffic back on blue in seconds</text>
  <line x1="665" y1="194" x2="665" y2="260" stroke="#EF4444" stroke-dasharray="4 4"/><line x1="785" y1="194" x2="785" y2="260" stroke="#EF4444" stroke-dasharray="4 4"/>

  <rect x="32" y="262" width="390" height="132" rx="12" fill="#1E293B" stroke="#334155"/>
  <text x="48" y="284" fill="#E2E8F0" font-size="12.5" font-weight="700">Always on, all strategies</text>
  <text x="48" y="304" fill="#94A3B8" font-size="11">Load-balancer health check: is the process answering /health?</text>
  <text x="48" y="322" fill="#94A3B8" font-size="11">Deployment circuit breaker: do new tasks keep failing to start?</text>
  <text x="48" y="346" fill="#FCD34D" font-size="11.5">Release 1.2 passes both. It starts fine and /health is 200.</text>
  <text x="48" y="364" fill="#FCD34D" font-size="11.5">It only burns pineapple pizzas. That is why the yellow and</text>
  <text x="48" y="380" fill="#FCD34D" font-size="11.5">red boxes exist.</text>
</svg>
