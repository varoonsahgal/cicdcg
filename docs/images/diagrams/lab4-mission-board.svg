<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="960" height="580" rx="18" fill="#0B1220"/>
  <text x="32" y="42" fill="#E2E8F0" font-size="20" font-weight="700">Lab 4 · exercise board</text>
  <text x="32" y="64" fill="#94A3B8" font-size="13">Core path first (Parts 1–9). Amber exercises A–E: do them all. Green challenges F–K: pick. Each one ends with a one-line proof.</text>
  <g font-size="12" fill="#E2E8F0">
    <!-- row 1 -->
    <g transform="translate(32,88)"><rect width="212" height="140" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/><text x="16" y="34" font-size="26">👻</text><text x="56" y="30" font-weight="700">A · The missing tag</text><text x="56" y="47" fill="#94A3B8" font-size="11">10 min + a wait · exercise</text><text x="16" y="78" fill="#CBD5E1" font-size="11.5">Deploy :v99. Read the stopped</text><text x="16" y="94" fill="#CBD5E1" font-size="11.5">reason. Watch the rollback.</text><rect x="16" y="106" width="118" height="22" rx="11" fill="#0F172A" stroke="#334155"/><text x="75" y="121" text-anchor="middle" fill="#FCD34D" font-size="10.5">deployment circuit breaker</text></g>
    <g transform="translate(260,88)"><rect width="212" height="140" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/><text x="16" y="34" font-size="26">🚧</text><text x="56" y="30" font-weight="700">B · Healthy, yet dead</text><text x="56" y="47" fill="#94A3B8" font-size="11">5 min · exercise</text><text x="16" y="78" fill="#CBD5E1" font-size="11.5">Remove the 8080 rule. Healthy</text><text x="16" y="94" fill="#CBD5E1" font-size="11.5">service, dead page. Which lied?</text><rect x="16" y="106" width="92" height="22" rx="11" fill="#0F172A" stroke="#334155"/><text x="62" y="121" text-anchor="middle" fill="#FCD34D" font-size="10.5">security groups</text></g>
    <g transform="translate(488,88)"><rect width="212" height="140" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/><text x="16" y="34" font-size="26">💥</text><text x="56" y="30" font-weight="700">C · Crash a container</text><text x="56" y="47" fill="#94A3B8" font-size="11">5 min · exercise</text><text x="16" y="78" fill="#CBD5E1" font-size="11.5">/crash exits the process. Time</text><text x="16" y="94" fill="#CBD5E1" font-size="11.5">the replacement.</text><rect x="16" y="106" width="74" height="22" rx="11" fill="#0F172A" stroke="#334155"/><text x="53" y="121" text-anchor="middle" fill="#FCD34D" font-size="10.5">self-healing</text></g>
    <g transform="translate(716,88)"><rect width="212" height="140" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/><text x="16" y="34" font-size="26">🧠</text><text x="56" y="30" font-weight="700">D · Out of memory</text><text x="56" y="47" fill="#94A3B8" font-size="11">10 min · exercise</text><text x="16" y="78" fill="#CBD5E1" font-size="11.5">/hog eats RAM until the kernel</text><text x="16" y="94" fill="#CBD5E1" font-size="11.5">says no. Exit code 137.</text><rect x="16" y="106" width="104" height="22" rx="11" fill="#0F172A" stroke="#334155"/><text x="68" y="121" text-anchor="middle" fill="#FCD34D" font-size="10.5">limits · exit codes</text></g>
    <!-- row 2 -->
    <g transform="translate(32,244)"><rect width="212" height="140" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/><text x="16" y="34" font-size="26">🔒</text><text x="56" y="30" font-weight="700">E · Immutable tags</text><text x="56" y="47" fill="#94A3B8" font-size="11">15 min · exercise</text><text x="16" y="78" fill="#CBD5E1" font-size="11.5">Make the repo immutable, watch</text><text x="16" y="94" fill="#CBD5E1" font-size="11.5">latest fail, deploy by digest.</text><rect x="16" y="106" width="86" height="22" rx="11" fill="#0F172A" stroke="#334155"/><text x="59" y="121" text-anchor="middle" fill="#FCD34D" font-size="10.5">ECR · digests</text></g>
    <g transform="translate(260,244)"><rect width="212" height="140" rx="14" fill="#1E293B" stroke="#22C55E" stroke-width="2"/><text x="16" y="34" font-size="26">⚖️</text><text x="56" y="30" font-weight="700">F · Load balancer ×3</text><text x="56" y="47" fill="#94A3B8" font-size="11">20 min · challenge</text><text x="16" y="78" fill="#CBD5E1" font-size="11.5">One stable address, three</text><text x="16" y="94" fill="#CBD5E1" font-size="11.5">containers, two health checks.</text><rect x="16" y="106" width="112" height="22" rx="11" fill="#0F172A" stroke="#334155"/><text x="72" y="121" text-anchor="middle" fill="#86EFAC" font-size="10.5">ALB · target groups</text></g>
    <g transform="translate(488,244)"><rect width="212" height="140" rx="14" fill="#1E293B" stroke="#22C55E" stroke-width="2"/><text x="16" y="34" font-size="26">🔎</text><text x="56" y="30" font-weight="700">G · Log detective</text><text x="56" y="47" fill="#94A3B8" font-size="11">10 min · challenge</text><text x="16" y="78" fill="#CBD5E1" font-size="11.5">One query across every task:</text><text x="16" y="94" fill="#CBD5E1" font-size="11.5">who served what, and when?</text><rect x="16" y="106" width="86" height="22" rx="11" fill="#0F172A" stroke="#334155"/><text x="59" y="121" text-anchor="middle" fill="#86EFAC" font-size="10.5">Logs Insights</text></g>
    <g transform="translate(716,244)"><rect width="212" height="140" rx="14" fill="#1E293B" stroke="#22C55E" stroke-width="2"/><text x="16" y="34" font-size="26">🧹</text><text x="56" y="30" font-weight="700">H · Lifecycle policy</text><text x="56" y="47" fill="#94A3B8" font-size="11">10 min · challenge</text><text x="16" y="78" fill="#CBD5E1" font-size="11.5">Keep the last five images.</text><text x="16" y="94" fill="#CBD5E1" font-size="11.5">Registries fill up; you pay.</text><rect x="16" y="106" width="82" height="22" rx="11" fill="#0F172A" stroke="#334155"/><text x="57" y="121" text-anchor="middle" fill="#86EFAC" font-size="10.5">ECR hygiene</text></g>
    <!-- row 3 -->
    <g transform="translate(32,400)"><rect width="212" height="140" rx="14" fill="#1E293B" stroke="#22C55E" stroke-width="2"/><text x="16" y="34" font-size="26">🛡️</text><text x="56" y="30" font-weight="700">I · Least privilege</text><text x="56" y="47" fill="#94A3B8" font-size="11">10 min · challenge</text><text x="16" y="78" fill="#CBD5E1" font-size="11.5">Replace PowerUser on the build</text><text x="16" y="94" fill="#CBD5E1" font-size="11.5">role with one repository ARN.</text><rect x="16" y="106" width="44" height="22" rx="11" fill="#0F172A" stroke="#334155"/><text x="38" y="121" text-anchor="middle" fill="#86EFAC" font-size="10.5">IAM</text></g>
    <g transform="translate(260,400)"><rect width="212" height="140" rx="14" fill="#1E293B" stroke="#22C55E" stroke-width="2"/><text x="16" y="34" font-size="26">🔐</text><text x="56" y="30" font-weight="700">J · Secrets, injected</text><text x="56" y="47" fill="#94A3B8" font-size="11">20 min · stretch</text><text x="16" y="78" fill="#CBD5E1" font-size="11.5">A SecureString injected before</text><text x="16" y="94" fill="#CBD5E1" font-size="11.5">your code runs. Robot refused.</text><rect x="16" y="106" width="98" height="22" rx="11" fill="#0F172A" stroke="#334155"/><text x="65" y="121" text-anchor="middle" fill="#86EFAC" font-size="10.5">SSM · ValueFrom</text></g>
    <g transform="translate(488,400)"><rect width="212" height="140" rx="14" fill="#1E293B" stroke="#22C55E" stroke-width="2"/><text x="16" y="34" font-size="26">🖥️</text><text x="56" y="30" font-weight="700">K · ECS Exec shell</text><text x="56" y="47" fill="#94A3B8" font-size="11">20 min · stretch</text><text x="16" y="78" fill="#CBD5E1" font-size="11.5">ECS Exec from CloudShell. Write</text><text x="16" y="94" fill="#CBD5E1" font-size="11.5">a file. Watch it vanish.</text><rect x="16" y="106" width="64" height="22" rx="11" fill="#0F172A" stroke="#334155"/><text x="48" y="121" text-anchor="middle" fill="#86EFAC" font-size="10.5">ECS Exec</text></g>
    <g transform="translate(716,400)"><rect width="212" height="140" rx="14" fill="#0F172A" stroke="#334155" stroke-dasharray="4 4"/><text x="16" y="30" fill="#E2E8F0" font-weight="700">How to read the board</text><text x="16" y="54" fill="#FCD34D" font-size="11.5">Amber = exercise · all five ≈ 45 min</text><text x="16" y="72" fill="#86EFAC" font-size="11.5">Green = challenge · pick, 10–20 min</text><text x="16" y="90" fill="#94A3B8" font-size="11.5">Stretch = needs the task role (Part 9)</text><text x="16" y="114" fill="#CBD5E1" font-size="11.5">Paste every proof into the class chat;</text><text x="16" y="130" fill="#CBD5E1" font-size="11.5">the instructor keeps a leaderboard.</text></g>
  </g>
  <text x="32" y="566" fill="#64748B" font-size="12">Waiting for the circuit breaker in A (≈ 10 min)? Do B and C meanwhile. The service keeps serving v3 the whole time: that is the point.</text>
</svg>
