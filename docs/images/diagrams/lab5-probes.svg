<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs>
  <rect width="960" height="436" rx="18" fill="#0B1220"/>
  <text x="32" y="42" fill="#E2E8F0" font-size="20" font-weight="700">Three ways a container can be “not fine”, and what Kubernetes does about each</text>
  <g font-size="11" text-anchor="middle">
    <!-- lane 1: readiness -->
    <text x="32" y="86" fill="#7DD3FC" font-size="12" font-weight="700" text-anchor="start">Readiness · Challenge B</text>
    <g transform="translate(32,96)"><rect width="200" height="74" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/><text x="100" y="22" fill="#E2E8F0" font-weight="700">GET /ready → 503</text><text x="100" y="40" fill="#CBD5E1">readinessProbe fails twice</text><text x="100" y="56" fill="#94A3B8" font-size="10.5">(you called /ready/off)</text></g>
    <g transform="translate(264,96)"><rect width="200" height="74" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/><text x="100" y="22" fill="#E2E8F0" font-weight="700">Pod: Running · READY 0/1</text><text x="100" y="40" fill="#CBD5E1">process untouched</text><text x="100" y="56" fill="#94A3B8" font-size="10.5">RESTARTS stays 0</text></g>
    <g transform="translate(496,96)"><rect width="200" height="74" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/><text x="100" y="22" fill="#E2E8F0" font-weight="700">removed from Endpoints</text><text x="100" y="40" fill="#CBD5E1">the Service stops sending traffic</text><text x="100" y="56" fill="#94A3B8" font-size="10.5">the other Pod serves alone</text></g>
    <g transform="translate(728,96)"><rect width="200" height="74" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/><text x="100" y="22" fill="#E2E8F0" font-weight="700">/ready/on → back in rotation</text><text x="100" y="40" fill="#CBD5E1">reach it with port-forward:</text><text x="100" y="56" fill="#94A3B8" font-size="10.5">the LB will not route to it</text></g>
    <!-- lane 2: liveness -->
    <text x="32" y="200" fill="#FCD34D" font-size="12" font-weight="700" text-anchor="start">Liveness · Challenge C, /crash</text>
    <g transform="translate(32,210)"><rect width="200" height="74" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/><text x="100" y="22" fill="#E2E8F0" font-weight="700">process exits, or hangs</text><text x="100" y="40" fill="#CBD5E1">exit → immediate; hang →</text><text x="100" y="56" fill="#94A3B8" font-size="10.5">livenessProbe fails 3 × 10 s</text></g>
    <g transform="translate(264,210)"><rect width="200" height="74" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/><text x="100" y="22" fill="#E2E8F0" font-weight="700">kubelet restarts the container</text><text x="100" y="40" fill="#CBD5E1">in place: same Pod name, same IP</text><text x="100" y="56" fill="#94A3B8" font-size="10.5">RESTARTS +1</text></g>
    <g transform="translate(496,210)"><rect width="200" height="74" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/><text x="100" y="22" fill="#E2E8F0" font-weight="700">while restarting: READY 0/1</text><text x="100" y="40" fill="#CBD5E1">readiness gates it out until</text><text x="100" y="56" fill="#94A3B8" font-size="10.5">/ready answers 200 again</text></g>
    <g transform="translate(728,210)"><rect width="200" height="74" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/><text x="100" y="22" fill="#E2E8F0" font-weight="700">keeps dying → CrashLoopBackOff</text><text x="100" y="40" fill="#CBD5E1">restart delay doubles, up to 5 min</text><text x="100" y="56" fill="#94A3B8" font-size="10.5">kubectl logs --previous tells why</text></g>
    <!-- lane 3: OOM -->
    <text x="32" y="314" fill="#FCA5A5" font-size="12" font-weight="700" text-anchor="start">Memory limit · Challenge C, /hog</text>
    <g transform="translate(32,324)"><rect width="200" height="74" rx="10" fill="#1E293B" stroke="#EF4444" stroke-width="2"/><text x="100" y="22" fill="#E2E8F0" font-weight="700">usage climbs past 256 Mi</text><text x="100" y="40" fill="#CBD5E1">resources.limits.memory</text><text x="100" y="56" fill="#94A3B8" font-size="10.5">watch it on the page's Memory row</text></g>
    <g transform="translate(264,324)"><rect width="200" height="74" rx="10" fill="#1E293B" stroke="#EF4444" stroke-width="2"/><text x="100" y="22" fill="#E2E8F0" font-weight="700">kernel OOM-kills the process</text><text x="100" y="40" fill="#CBD5E1">SIGKILL · exit code 137</text><text x="100" y="56" fill="#94A3B8" font-size="10.5">(128 + 9) no log line, no goodbye</text></g>
    <g transform="translate(496,324)"><rect width="200" height="74" rx="10" fill="#1E293B" stroke="#EF4444" stroke-width="2"/><text x="100" y="22" fill="#E2E8F0" font-weight="700">Last State: Terminated</text><text x="100" y="40" fill="#CBD5E1">Reason: OOMKilled</text><text x="100" y="56" fill="#94A3B8" font-size="10.5">kubectl describe pod shows it</text></g>
    <g transform="translate(728,324)"><rect width="200" height="74" rx="10" fill="#1E293B" stroke="#EF4444" stroke-width="2"/><text x="100" y="22" fill="#E2E8F0" font-weight="700">restarted in place, like lane 2</text><text x="100" y="40" fill="#CBD5E1">fix = raise the limit or fix the leak</text><text x="100" y="56" fill="#94A3B8" font-size="10.5">ECS: OutOfMemoryError, task replaced</text></g>
  </g>
  <g stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M232 133H262"/><path d="M464 133H494"/><path d="M696 133H726"/><path d="M232 247H262"/><path d="M464 247H494"/><path d="M696 247H726"/><path d="M232 361H262"/><path d="M464 361H494"/><path d="M696 361H726"/></g>
  <text x="32" y="422" fill="#64748B" font-size="11">ECS has one health check and one answer: unhealthy → stop the task, start another (new ID, new IP). Kubernetes separates “no traffic” from “restart”.</text>
</svg>
