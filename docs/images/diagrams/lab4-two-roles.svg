<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs>
  <rect width="960" height="440" rx="18" fill="#0B1220"/>
  <text x="32" y="42" fill="#E2E8F0" font-size="20" font-weight="700">Two robots run your task, and they fail differently</text>
  <!-- execution role -->
  <g font-size="12">
    <rect x="32" y="66" width="380" height="256" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <text x="52" y="94" fill="#FCD34D" font-size="15" font-weight="700">Task EXECUTION role</text>
    <text x="52" y="112" fill="#94A3B8" font-size="11.5">used by the ECS agent, BEFORE your code runs</text>
    <g fill="#CBD5E1" font-family="ui-monospace,Menlo,monospace" font-size="11">
      <text x="52" y="138">ecr:GetAuthorizationToken · BatchGetImage</text><text x="52" y="152">ecr:GetDownloadUrlForLayer</text>
      <text x="52" y="184">logs:CreateLogStream · logs:PutLogEvents</text>
      <text x="52" y="216">ssm:GetParameters · secretsmanager:GetSecretValue</text>
    </g>
    <g fill="#94A3B8" font-size="11"><text x="52" y="166">→ pull the image</text><text x="52" y="198">→ ship the log</text><text x="52" y="230">→ inject “secrets” into env (Challenge J)</text></g>
    <line x1="52" y1="244" x2="392" y2="244" stroke="#334155"/>
    <text x="52" y="264" fill="#FCA5A5" font-size="11.5">Fails → the task never starts:</text>
    <text x="52" y="280" fill="#FCA5A5" font-size="11" font-family="ui-monospace,Menlo,monospace">CannotPullContainerError</text>
    <text x="52" y="294" fill="#FCA5A5" font-size="11" font-family="ui-monospace,Menlo,monospace">ResourceInitializationError</text>
    <text x="52" y="312" fill="#64748B" font-size="11">Shared: one per account is normal (ecsTaskExecutionRole)</text>
  </g>
  <!-- task role -->
  <g font-size="12">
    <rect x="548" y="66" width="380" height="256" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <text x="568" y="94" fill="#7DD3FC" font-size="15" font-weight="700">TASK role</text>
    <text x="568" y="112" fill="#94A3B8" font-size="11.5">used by YOUR CODE, while it runs</text>
    <g fill="#CBD5E1" font-family="ui-monospace,Menlo,monospace" font-size="11">
      <text x="568" y="138">ssm:GetParameter</text>
      <text x="568" y="184">ssmmessages:Create*Channel · Open*Channel</text>
      <text x="568" y="216">s3:GetObject · dynamodb:Query · …</text>
    </g>
    <g fill="#94A3B8" font-size="11"><text x="568" y="152">→ the message of the day (Part 9)</text><text x="568" y="198">→ a shell inside the task (Challenge K)</text><text x="568" y="230">→ whatever your app really needs, and nothing else</text></g>
    <line x1="568" y1="244" x2="908" y2="244" stroke="#334155"/>
    <text x="568" y="264" fill="#FCA5A5" font-size="11.5">Fails → the task runs; the AWS call fails, on the page:</text>
    <text x="568" y="280" fill="#FCA5A5" font-size="11" font-family="ui-monospace,Menlo,monospace">NoCredentialsError    (no role at all)</text>
    <text x="568" y="294" fill="#FCA5A5" font-size="11" font-family="ui-monospace,Menlo,monospace">AccessDeniedException (role, missing verb)</text>
    <text x="568" y="312" fill="#64748B" font-size="11">Per application, as small as possible</text>
  </g>
  <!-- the task in the middle -->
  <g>
    <rect x="432" y="130" width="96" height="120" rx="12" fill="#0F172A" stroke="#475569"/>
    <text x="480" y="152" fill="#E2E8F0" font-size="12" font-weight="700" text-anchor="middle">task</text>
    <rect x="446" y="164" width="68" height="56" rx="8" fill="#1E293B" stroke="#22C55E"/>
    <text x="480" y="186" fill="#86EFAC" font-size="11" text-anchor="middle">container</text><text x="480" y="202" fill="#94A3B8" font-size="10" text-anchor="middle">web :8080</text>
    <text x="480" y="240" fill="#64748B" font-size="10" text-anchor="middle">Fargate</text>
  </g>
  <g stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M412 190H430"/><path d="M548 190H530"/></g>
  <text x="421" y="180" fill="#94A3B8" font-size="9" text-anchor="middle">agent</text><text x="539" y="180" fill="#94A3B8" font-size="9" text-anchor="middle">SDK</text>
  <!-- footer -->
  <g font-size="12" fill="#CBD5E1">
    <text x="32" y="356">Where the code finds its keys: the agent sets <tspan font-family="ui-monospace,Menlo,monospace" fill="#FCD34D">AWS_CONTAINER_CREDENTIALS_RELATIVE_URI</tspan>; the SDK fetches short-lived credentials</text>
    <text x="32" y="376">for the task role from <tspan font-family="ui-monospace,Menlo,monospace" fill="#FCD34D">169.254.170.2</tspan>. No access key is ever baked into the image (ours even disables the EC2 metadata fallback).</text>
    <text x="32" y="408" fill="#94A3B8">Lab 2 taught one robot per job. ECS makes it two robots per task. Kubernetes calls the second one a <tspan fill="#C4B5FD">service account</tspan> (EKS Pod Identity / IRSA).</text>
  </g>
</svg>
