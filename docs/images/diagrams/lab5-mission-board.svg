<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="960" height="580" rx="18" fill="#0B1220"/>
  <text x="32" y="42" fill="#E2E8F0" font-size="20" font-weight="700">Lab 5 · challenge board</text>
  <text x="32" y="64" fill="#94A3B8" font-size="13">Core path first (Parts 1–7). Then pick. A–D are the ones to insist on. Every challenge is a few kubectl commands and one proof line.</text>
  <g font-size="12" fill="#E2E8F0">
    <g transform="translate(32,88)"><rect width="212" height="140" rx="14" fill="#1E293B" stroke="#A78BFA" stroke-width="2"/><text x="16" y="34" font-size="26">📈</text><text x="56" y="30" font-weight="700">A · Autoscale on CPU</text><text x="56" y="47" fill="#94A3B8" font-size="11">15 min · recommended</text><text x="16" y="78" fill="#CBD5E1" font-size="11.5">HPA + a load generator.</text><text x="16" y="94" fill="#CBD5E1" font-size="11.5">Watch 2 → 6 and back down.</text><rect x="16" y="106" width="118" height="22" rx="11" fill="#0F172A" stroke="#334155"/><text x="75" y="121" text-anchor="middle" fill="#C4B5FD" font-size="10.5">HPA · metrics-server</text></g>
    <g transform="translate(260,88)"><rect width="212" height="140" rx="14" fill="#1E293B" stroke="#A78BFA" stroke-width="2"/><text x="16" y="34" font-size="26">🚦</text><text x="56" y="30" font-weight="700">B · Readiness vs liveness</text><text x="56" y="47" fill="#94A3B8" font-size="11">10 min · recommended</text><text x="16" y="78" fill="#CBD5E1" font-size="11.5">/ready/off: one Pod leaves the</text><text x="16" y="94" fill="#CBD5E1" font-size="11.5">Service; the process lives on.</text><rect x="16" y="106" width="104" height="22" rx="11" fill="#0F172A" stroke="#334155"/><text x="68" y="121" text-anchor="middle" fill="#C4B5FD" font-size="10.5">probes · endpoints</text></g>
    <g transform="translate(488,88)"><rect width="212" height="140" rx="14" fill="#1E293B" stroke="#A78BFA" stroke-width="2"/><text x="16" y="34" font-size="26">💥</text><text x="56" y="30" font-weight="700">C · Crash, then OOM</text><text x="56" y="47" fill="#94A3B8" font-size="11">10 min · recommended</text><text x="16" y="78" fill="#CBD5E1" font-size="11.5">/crash restarts in place.</text><text x="16" y="94" fill="#CBD5E1" font-size="11.5">/hog ends in exit code 137.</text><rect x="16" y="106" width="138" height="22" rx="11" fill="#0F172A" stroke="#334155"/><text x="85" y="121" text-anchor="middle" fill="#C4B5FD" font-size="10.5">restartPolicy · limits · 137</text></g>
    <g transform="translate(716,88)"><rect width="212" height="140" rx="14" fill="#1E293B" stroke="#A78BFA" stroke-width="2"/><text x="16" y="34" font-size="26">🏷️</text><text x="56" y="30" font-weight="700">D · Break the selector</text><text x="56" y="47" fill="#94A3B8" font-size="11">10 min · recommended</text><text x="16" y="78" fill="#CBD5E1" font-size="11.5">A typo in the selector: the LB</text><text x="16" y="94" fill="#CBD5E1" font-size="11.5">answers, nobody is behind it.</text><rect x="16" y="106" width="104" height="22" rx="11" fill="#0F172A" stroke="#334155"/><text x="68" y="121" text-anchor="middle" fill="#C4B5FD" font-size="10.5">labels · selectors</text></g>
    <g transform="translate(32,244)"><rect width="212" height="140" rx="14" fill="#1E293B" stroke="#A78BFA" stroke-width="2"/><text x="16" y="34" font-size="26">🪂</text><text x="56" y="30" font-weight="700">E · Recreate vs Rolling</text><text x="56" y="47" fill="#94A3B8" font-size="11">10 min</text><text x="16" y="78" fill="#CBD5E1" font-size="11.5">A curl loop counts the errors</text><text x="16" y="94" fill="#CBD5E1" font-size="11.5">of Recreate vs RollingUpdate.</text><rect x="16" y="106" width="128" height="22" rx="11" fill="#0F172A" stroke="#334155"/><text x="80" y="121" text-anchor="middle" fill="#C4B5FD" font-size="10.5">strategy · zero downtime</text></g>
    <g transform="translate(260,244)"><rect width="212" height="140" rx="14" fill="#1E293B" stroke="#A78BFA" stroke-width="2"/><text x="16" y="34" font-size="26">✅</text><text x="56" y="30" font-weight="700">F · A smoke test as a Job</text><text x="56" y="47" fill="#94A3B8" font-size="11">10 min</text><text x="16" y="78" fill="#CBD5E1" font-size="11.5">Runs to completion; exit code</text><text x="16" y="94" fill="#CBD5E1" font-size="11.5">= verdict. kubectl wait gates.</text><rect x="16" y="106" width="94" height="22" rx="11" fill="#0F172A" stroke="#334155"/><text x="63" y="121" text-anchor="middle" fill="#C4B5FD" font-size="10.5">Jobs · pipelines</text></g>
    <g transform="translate(488,244)"><rect width="212" height="140" rx="14" fill="#1E293B" stroke="#A78BFA" stroke-width="2"/><text x="16" y="34" font-size="26">🧭</text><text x="56" y="30" font-weight="700">G · Discovery from inside</text><text x="56" y="47" fill="#94A3B8" font-size="11">10 min</text><text x="16" y="78" fill="#CBD5E1" font-size="11.5">A throw-away Pod runs wget</text><text x="16" y="94" fill="#CBD5E1" font-size="11.5">against http://mission-control.</text><rect x="16" y="106" width="108" height="22" rx="11" fill="#0F172A" stroke="#334155"/><text x="70" y="121" text-anchor="middle" fill="#C4B5FD" font-size="10.5">CoreDNS · ClusterIP</text></g>
    <g transform="translate(716,244)"><rect width="212" height="140" rx="14" fill="#1E293B" stroke="#A78BFA" stroke-width="2"/><text x="16" y="34" font-size="26">🔑</text><text x="56" y="30" font-weight="700">H · A Secret, and base64</text><text x="56" y="47" fill="#94A3B8" font-size="11">10 min</text><text x="16" y="78" fill="#CBD5E1" font-size="11.5">Inject LAUNCH_CODE from a Secret,</text><text x="16" y="94" fill="#CBD5E1" font-size="11.5">then decode it in one command.</text><rect x="16" y="106" width="98" height="22" rx="11" fill="#0F172A" stroke="#334155"/><text x="65" y="121" text-anchor="middle" fill="#C4B5FD" font-size="10.5">Secrets · envFrom</text></g>
    <g transform="translate(32,400)"><rect width="212" height="140" rx="14" fill="#1E293B" stroke="#A78BFA" stroke-width="2"/><text x="16" y="34" font-size="26">🛡️</text><text x="56" y="30" font-weight="700">I · PodDisruptionBudget</text><text x="56" y="47" fill="#94A3B8" font-size="11">5 min</text><text x="16" y="78" fill="#CBD5E1" font-size="11.5">“Keep at least one of mine</text><text x="16" y="94" fill="#CBD5E1" font-size="11.5">running” through maintenance.</text><rect x="16" y="106" width="54" height="22" rx="11" fill="#0F172A" stroke="#334155"/><text x="43" y="121" text-anchor="middle" fill="#C4B5FD" font-size="10.5">policy</text></g>
    <g transform="translate(260,400)"><rect width="212" height="140" rx="14" fill="#1E293B" stroke="#A78BFA" stroke-width="2"/><text x="16" y="34" font-size="26">📜</text><text x="56" y="30" font-weight="700">J · The YAML it stores</text><text x="56" y="47" fill="#94A3B8" font-size="11">5 min</text><text x="16" y="78" fill="#CBD5E1" font-size="11.5">Find three fields you never</text><text x="16" y="94" fill="#CBD5E1" font-size="11.5">wrote, and the status block.</text><rect x="16" y="106" width="96" height="22" rx="11" fill="#0F172A" stroke="#334155"/><text x="64" y="121" text-anchor="middle" fill="#C4B5FD" font-size="10.5">defaults · status</text></g>
    <g transform="translate(488,400)"><rect width="440" height="140" rx="14" fill="#0F172A" stroke="#334155" stroke-dasharray="4 4"/><text x="16" y="30" fill="#E2E8F0" font-weight="700">How to read the board</text><text x="16" y="56" fill="#C4B5FD" font-size="11.5">Recommended A–D ≈ 45 min · all ten ≈ 95 min · all inside your namespace.</text><text x="16" y="78" fill="#CBD5E1" font-size="11.5">Same shape every time: predict → apply → observe (get / describe / logs) → undo.</text><text x="16" y="100" fill="#CBD5E1" font-size="11.5">Proof = one pasted line: an HPA row, a 0/1 Pod, a 137, an empty Endpoints…</text><text x="16" y="124" fill="#94A3B8" font-size="11.5">Finished early? Try C on a neighbour's namespace: the Forbidden is a bonus proof.</text></g>
  </g>
  <text x="32" y="566" fill="#64748B" font-size="12">Running the HPA challenge all at once as a class can fill the two nodes (Pending Pods, “Insufficient cpu”). The instructor may ask for two waves.</text>
</svg>
