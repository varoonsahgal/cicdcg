<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="960" height="450" rx="18" fill="#0B1220"/>
  <text x="32" y="42" fill="#E2E8F0" font-size="20" font-weight="700">The blast-radius dial: minimum healthy % and maximum %</text>
  <text x="32" y="64" fill="#94A3B8" font-size="13">Two desired tasks, rolling from v2 (amber) to v3 (green). Dotted = starting, not yet healthy.</text>
  <!-- column headers -->
  <g fill="#64748B" font-size="11" text-anchor="middle"><text x="300" y="92">t0 · start</text><text x="470" y="92">t1 · new tasks start</text><text x="640" y="92">t2 · health checks pass</text><text x="810" y="92">t3 · done</text></g>
  <!-- lane 1 -->
  <rect x="32" y="104" width="896" height="130" rx="14" fill="#1E293B" stroke="#334155"/>
  <text x="48" y="130" fill="#E2E8F0" font-size="13" font-weight="700">min 100 % · max 200 %</text>
  <text x="48" y="148" fill="#94A3B8" font-size="11">the default you used in Part 7</text>
  <text x="48" y="178" fill="#86EFAC" font-size="11.5">never below 2 healthy</text>
  <text x="48" y="194" fill="#FCD34D" font-size="11.5">peak 4 tasks: you pay for the burst</text>
  <text x="48" y="218" fill="#64748B" font-size="11">Kubernetes: maxUnavailable 0 · maxSurge 2</text>
  <g font-size="10" font-weight="700" text-anchor="middle">
    <!-- t0 -->
    <rect x="266" y="150" width="30" height="30" rx="6" fill="#F59E0B"/><text x="281" y="170" fill="#0B1220">v2</text>
    <rect x="304" y="150" width="30" height="30" rx="6" fill="#F59E0B"/><text x="319" y="170" fill="#0B1220">v2</text>
    <!-- t1 -->
    <rect x="398" y="150" width="30" height="30" rx="6" fill="#F59E0B"/><text x="413" y="170" fill="#0B1220">v2</text>
    <rect x="436" y="150" width="30" height="30" rx="6" fill="#F59E0B"/><text x="451" y="170" fill="#0B1220">v2</text>
    <rect x="474" y="150" width="30" height="30" rx="6" fill="none" stroke="#22C55E" stroke-dasharray="3 3"/><text x="489" y="170" fill="#86EFAC">v3</text>
    <rect x="512" y="150" width="30" height="30" rx="6" fill="none" stroke="#22C55E" stroke-dasharray="3 3"/><text x="527" y="170" fill="#86EFAC">v3</text>
    <!-- t2 -->
    <rect x="568" y="150" width="30" height="30" rx="6" fill="#F59E0B"/><text x="583" y="170" fill="#0B1220">v2</text>
    <rect x="606" y="150" width="30" height="30" rx="6" fill="#F59E0B"/><text x="621" y="170" fill="#0B1220">v2</text>
    <rect x="644" y="150" width="30" height="30" rx="6" fill="#22C55E"/><text x="659" y="170" fill="#0B1220">v3</text>
    <rect x="682" y="150" width="30" height="30" rx="6" fill="#22C55E"/><text x="697" y="170" fill="#0B1220">v3</text>
    <!-- t3 -->
    <rect x="776" y="150" width="30" height="30" rx="6" fill="#22C55E"/><text x="791" y="170" fill="#0B1220">v3</text>
    <rect x="814" y="150" width="30" height="30" rx="6" fill="#22C55E"/><text x="829" y="170" fill="#0B1220">v3</text>
  </g>
  <g fill="#94A3B8" font-size="10" text-anchor="middle"><text x="300" y="204">2 healthy</text><text x="470" y="204">2 healthy · 4 running</text><text x="640" y="204">4 healthy</text><text x="810" y="204">2 healthy</text></g>
  <!-- lane 2 -->
  <rect x="32" y="250" width="896" height="130" rx="14" fill="#1E293B" stroke="#334155"/>
  <text x="48" y="276" fill="#E2E8F0" font-size="13" font-weight="700">min 50 % · max 100 %</text>
  <text x="48" y="294" fill="#94A3B8" font-size="11">Part 8b: turn the dial and watch</text>
  <text x="48" y="324" fill="#FCA5A5" font-size="11.5">capacity dips to 1 task, twice</text>
  <text x="48" y="340" fill="#86EFAC" font-size="11.5">never more than 2 tasks: no burst cost</text>
  <text x="48" y="364" fill="#64748B" font-size="11">Lab 2's OneAtATime · K8s: maxUnavailable 1 · maxSurge 0</text>
  <g fill="#64748B" font-size="11" text-anchor="middle"><text x="300" y="268">t0 · start</text><text x="470" y="268">t1 · one old stopped</text><text x="640" y="268">t2 · one new healthy</text><text x="810" y="268">t3 · second swap</text></g>
  <g font-size="10" font-weight="700" text-anchor="middle">
    <rect x="266" y="296" width="30" height="30" rx="6" fill="#F59E0B"/><text x="281" y="316" fill="#0B1220">v2</text>
    <rect x="304" y="296" width="30" height="30" rx="6" fill="#F59E0B"/><text x="319" y="316" fill="#0B1220">v2</text>
    <rect x="436" y="296" width="30" height="30" rx="6" fill="#F59E0B"/><text x="451" y="316" fill="#0B1220">v2</text>
    <rect x="474" y="296" width="30" height="30" rx="6" fill="none" stroke="#EF4444" stroke-dasharray="3 3"/><text x="489" y="316" fill="#FCA5A5">✕</text>
    <rect x="606" y="296" width="30" height="30" rx="6" fill="#F59E0B"/><text x="621" y="316" fill="#0B1220">v2</text>
    <rect x="644" y="296" width="30" height="30" rx="6" fill="#22C55E"/><text x="659" y="316" fill="#0B1220">v3</text>
    <rect x="776" y="296" width="30" height="30" rx="6" fill="#22C55E"/><text x="791" y="316" fill="#0B1220">v3</text>
    <rect x="814" y="296" width="30" height="30" rx="6" fill="none" stroke="#22C55E" stroke-dasharray="3 3"/><text x="829" y="316" fill="#86EFAC">v3</text>
  </g>
  <g fill="#94A3B8" font-size="10" text-anchor="middle"><text x="300" y="350">2 healthy</text><text x="470" y="350" fill="#FCA5A5">1 healthy (50 %)</text><text x="640" y="350">2 healthy</text><text x="810" y="350" fill="#FCA5A5">1 healthy again</text></g>
  <text x="32" y="406" fill="#CBD5E1" font-size="12">Rule of thumb: user-facing services never go below 100 %. A second copy for a few minutes costs less than an outage.</text>
  <text x="32" y="424" fill="#CBD5E1" font-size="12">The same dial exists in CodeDeploy (Lab 2), ECS and Kubernetes; only the spelling changes.</text>
  <text x="32" y="442" fill="#64748B" font-size="11">Health checks decide when a dotted square turns solid. Without them “started” would count as “healthy” and the dial would protect nothing.</text>
</svg>
