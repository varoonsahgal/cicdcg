<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs>
  <rect width="960" height="400" rx="18" fill="#0B1220"/>
  <text x="32" y="44" fill="#E2E8F0" font-size="20" font-weight="700">Lab 2 · upload a zip, get a website</text>
  <g font-size="13" fill="#E2E8F0" text-anchor="middle">
    <g transform="translate(40,110)"><rect width="150" height="120" rx="14" fill="#1E293B" stroke="#334155"/><text x="75" y="30" font-weight="700">You</text><text x="75" y="62" font-size="30">⬆️</text><text x="75" y="92" fill="#94A3B8" font-size="12">upload SampleApp.zip</text><text x="75" y="108" fill="#94A3B8" font-size="12">to a versioned bucket</text></g>
    <g transform="translate(240,80)"><rect width="440" height="180" rx="16" fill="#0F172A" stroke="#2563EB" stroke-width="2"/><text x="220" y="28" fill="#93C5FD" font-weight="700">CodePipeline · participant-NN-pipeline</text>
      <g transform="translate(30,52)"><rect width="170" height="96" rx="12" fill="#1E293B" stroke="#22C55E" stroke-width="2"/><text x="85" y="26" font-weight="700">Source</text><text x="85" y="48" fill="#94A3B8" font-size="12">Amazon S3</text><text x="85" y="66" fill="#94A3B8" font-size="11">pins the exact object</text><text x="85" y="80" fill="#94A3B8" font-size="11">version → SourceArtifact</text></g>
      <g transform="translate(240,52)"><rect width="170" height="96" rx="12" fill="#1E293B" stroke="#22C55E" stroke-width="2"/><text x="85" y="26" font-weight="700">Deploy</text><text x="85" y="48" fill="#94A3B8" font-size="12">AWS CodeDeploy</text><text x="85" y="66" fill="#94A3B8" font-size="11">app + deployment group</text><text x="85" y="80" fill="#94A3B8" font-size="11">→ EC2 instances by tag</text></g>
      <path d="M200 100H238" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
      <text x="220" y="168" fill="#64748B" font-size="11">artifact store: codepipeline-us-west-2-… bucket</text>
    </g>
    <g transform="translate(740,80)"><rect width="190" height="180" rx="14" fill="#1E293B" stroke="#334155"/><text x="95" y="30" font-weight="700">EC2 · participant-NN-webserver</text><rect x="20" y="46" width="150" height="40" rx="8" fill="#0F172A" stroke="#F59E0B"/><text x="95" y="71" fill="#FCD34D" font-size="12">CodeDeploy agent</text><text x="95" y="108" fill="#94A3B8" font-size="11">polls · downloads bundle</text><text x="95" y="124" fill="#94A3B8" font-size="11">runs appspec hooks</text><rect x="20" y="138" width="150" height="30" rx="8" fill="#0F172A" stroke="#475569"/><text x="95" y="158" fill="#86EFAC" font-size="12">Apache → index.html</text></g>
  </g>
  <g stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#a)"><path d="M190 170H238"/><path d="M680 170H738"/></g>
  <g transform="translate(240,290)"><rect width="440" height="70" rx="12" fill="#172554" stroke="#3B82F6" stroke-dasharray="5 4"/><text x="220" y="26" fill="#BFDBFE" font-size="12" text-anchor="middle" font-weight="700">⚡ what makes it “continuous”</text><text x="220" y="48" fill="#93C5FD" font-size="11" text-anchor="middle">S3 write → CloudTrail event → EventBridge rule → StartPipelineExecution (created for you by the wizard)</text></g>
  <text x="115" y="300" fill="#94A3B8" font-size="12" text-anchor="middle">every new upload</text><text x="115" y="318" fill="#94A3B8" font-size="12" text-anchor="middle">= a new version</text><text x="115" y="336" fill="#94A3B8" font-size="12" text-anchor="middle">= a new execution</text>
</svg>
