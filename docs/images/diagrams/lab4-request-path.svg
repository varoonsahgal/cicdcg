<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs>
  <rect width="960" height="400" rx="18" fill="#0B1220"/>
  <text x="32" y="42" fill="#E2E8F0" font-size="20" font-weight="700">From the internet to your container (Challenge F), and the two health checks on the way</text>
  <g font-size="11" text-anchor="middle">
    <g transform="translate(32,80)"><rect width="96" height="120" rx="12" fill="#1E293B" stroke="#334155"/><text x="48" y="30" font-size="24">🌍</text><text x="48" y="58" fill="#E2E8F0" font-size="13" font-weight="700">Internet</text><text x="48" y="80" fill="#94A3B8">your browser</text><text x="48" y="96" fill="#94A3B8">GET / :80</text></g>
    <g transform="translate(160,80)"><rect width="170" height="120" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/><text x="85" y="24" fill="#7DD3FC" font-size="13" font-weight="700">Application LB</text><text x="85" y="40" fill="#94A3B8" font-size="10">participant-NN-mission-alb</text><text x="85" y="62" fill="#CBD5E1">listener :80</text><text x="85" y="84" fill="#CBD5E1">SG alb-sg:</text><text x="85" y="98" fill="#CBD5E1">:80 from 0.0.0.0/0</text></g>
    <g transform="translate(362,80)"><rect width="190" height="120" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/><text x="95" y="24" fill="#7DD3FC" font-size="13" font-weight="700">Target group</text><text x="95" y="40" fill="#94A3B8" font-size="10">participant-NN-mission-tg</text><text x="95" y="62" fill="#CBD5E1">type IP · port 8080</text><text x="95" y="78" fill="#FCD34D">② health check GET /health</text><text x="95" y="98" fill="#CBD5E1">targets registered by ECS,</text><text x="95" y="112" fill="#CBD5E1">never by you</text></g>
    <g transform="translate(584,80)"><rect width="160" height="120" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/><text x="80" y="24" fill="#FCD34D" font-size="13" font-weight="700">Task ENI (awsvpc)</text><text x="80" y="40" fill="#94A3B8" font-size="10">one private IP per task</text><text x="80" y="62" fill="#CBD5E1">SG mission-sg:</text><text x="80" y="78" fill="#CBD5E1">:8080 from alb-sg</text><text x="80" y="98" fill="#94A3B8">(or from anywhere,</text><text x="80" y="112" fill="#94A3B8">as in Part 7)</text></g>
    <g transform="translate(776,80)"><rect width="152" height="120" rx="12" fill="#1E293B" stroke="#22C55E" stroke-width="2"/><text x="76" y="24" fill="#86EFAC" font-size="13" font-weight="700">container</text><text x="76" y="40" fill="#94A3B8" font-size="10">web · python app.py</text><text x="76" y="62" fill="#CBD5E1">listens on :8080</text><text x="76" y="84" fill="#FCD34D">① health check, inside:</text><text x="76" y="98" fill="#FCD34D" font-size="9.5">curl 127.0.0.1:8080/health</text></g>
  </g>
  <g stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#a)"><path d="M128 140H158"/><path d="M330 140H360"/><path d="M552 140H582"/><path d="M744 140H774"/></g>
  <g font-size="12" fill="#CBD5E1">
    <text x="32" y="240"><tspan fill="#FCD34D" font-weight="700">① inside-out.</tspan> The ECS agent runs the task definition's health check <tspan fill="#fff">inside</tspan> the container. It proves the process answers. It says nothing about the network.</text>
    <text x="32" y="262">Three failures in a row → ECS stops the task and the service starts a new one.</text>
    <text x="32" y="294"><tspan fill="#7DD3FC" font-weight="700">② outside-in.</tspan> The load balancer probes every target <tspan fill="#fff">through the network</tspan>, like a user would. Unhealthy → no traffic to that target, and ECS replaces it too.</text>
    <text x="32" y="316">Exercise B is ① passing while ② (or your browser) cannot get through: a security-group problem wearing a healthy badge.</text>
    <text x="32" y="350" fill="#94A3B8">Kubernetes (Lab 5): ① is the livenessProbe, ② is the readinessProbe plus the Service's endpoints list. Same two questions: <tspan fill="#E2E8F0">is it alive?</tspan> and <tspan fill="#E2E8F0">should it get traffic?</tspan></text>
    <text x="32" y="378" fill="#64748B" font-size="11">Cost: an ALB is about US$0.02 per hour plus traffic. Delete it in the clean-up; the target group and alb-sg go with it.</text>
  </g>
</svg>
