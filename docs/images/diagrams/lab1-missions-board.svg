<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="960" height="470" rx="18" fill="#0B1220"/>
  <text x="32" y="42" fill="#E2E8F0" font-size="20" font-weight="700">Lab 1 · mission board</text>
  <text x="32" y="64" fill="#94A3B8" font-size="13">Core path first (Parts 1–5). Then pick missions. Each one earns a badge and touches one new idea or one new AWS service.</text>
  <g font-size="12" fill="#E2E8F0">
    <!-- row 1 -->
    <g transform="translate(32,88)"><rect width="212" height="150" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/><text x="16" y="34" font-size="26">🧪</text><text x="56" y="30" font-weight="700">A · Gatekeeper</text><text x="56" y="47" fill="#94A3B8" font-size="11">10 min · recommended</text><text x="16" y="78" fill="#CBD5E1" font-size="11.5">Break a test on purpose and</text><text x="16" y="94" fill="#CBD5E1" font-size="11.5">watch the build turn red.</text><rect x="16" y="112" width="86" height="22" rx="11" fill="#0F172A" stroke="#334155"/><text x="59" y="127" text-anchor="middle" fill="#7DD3FC" font-size="10.5">CodeBuild reports</text></g>
    <g transform="translate(260,88)"><rect width="212" height="150" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/><text x="16" y="34" font-size="26">🏷️</text><text x="56" y="30" font-weight="700">B · Stamp it</text><text x="56" y="47" fill="#94A3B8" font-size="11">10 min · recommended</text><text x="16" y="78" fill="#CBD5E1" font-size="11.5">Environment variables and</text><text x="16" y="94" fill="#CBD5E1" font-size="11.5">CodeBuild's built-in ones.</text><rect x="16" y="112" width="96" height="22" rx="11" fill="#0F172A" stroke="#334155"/><text x="64" y="127" text-anchor="middle" fill="#7DD3FC" font-size="10.5">project settings</text></g>
    <g transform="translate(488,88)"><rect width="212" height="150" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/><text x="16" y="34" font-size="26">📦</text><text x="56" y="30" font-weight="700">C · Ship more</text><text x="56" y="47" fill="#94A3B8" font-size="11">10 min · recommended</text><text x="16" y="78" fill="#CBD5E1" font-size="11.5">Put a build-info file in the</text><text x="16" y="94" fill="#CBD5E1" font-size="11.5">artifact next to the jar.</text><rect x="16" y="112" width="70" height="22" rx="11" fill="#0F172A" stroke="#334155"/><text x="51" y="127" text-anchor="middle" fill="#7DD3FC" font-size="10.5">artifacts</text></g>
    <g transform="translate(716,88)"><rect width="212" height="150" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/><text x="16" y="34" font-size="26">🕵️</text><text x="56" y="30" font-weight="700">D · The disabled test</text><text x="56" y="47" fill="#94A3B8" font-size="11">10 min · recommended</text><text x="16" y="78" fill="#CBD5E1" font-size="11.5">Someone switched a test off.</text><text x="16" y="94" fill="#CBD5E1" font-size="11.5">Turn it on. Fix the code, not the test.</text><rect x="16" y="112" width="74" height="22" rx="11" fill="#0F172A" stroke="#334155"/><text x="53" y="127" text-anchor="middle" fill="#FCD34D" font-size="10.5">a real bug</text></g>
    <!-- row 2 -->
    <g transform="translate(32,258)"><rect width="212" height="150" rx="14" fill="#1E293B" stroke="#22C55E" stroke-width="2"/><text x="16" y="34" font-size="26">🔐</text><text x="56" y="30" font-weight="700">E · Secret keeper</text><text x="56" y="47" fill="#94A3B8" font-size="11">15 min · recommended</text><text x="16" y="78" fill="#CBD5E1" font-size="11.5">Inject a secret at build time.</text><text x="16" y="94" fill="#CBD5E1" font-size="11.5">First the robot is refused. Fix its role.</text><rect x="16" y="112" width="112" height="22" rx="11" fill="#0F172A" stroke="#334155"/><text x="72" y="127" text-anchor="middle" fill="#86EFAC" font-size="10.5">Secrets Manager · IAM</text></g>
    <g transform="translate(260,258)"><rect width="212" height="150" rx="14" fill="#1E293B" stroke="#22C55E" stroke-width="2"/><text x="16" y="34" font-size="26">⚡</text><text x="56" y="30" font-weight="700">F · Speed demon</text><text x="56" y="47" fill="#94A3B8" font-size="11">10 min · bonus</text><text x="16" y="78" fill="#CBD5E1" font-size="11.5">Cache Maven downloads in S3.</text><text x="16" y="94" fill="#CBD5E1" font-size="11.5">Measure the build before and after.</text><rect x="16" y="112" width="86" height="22" rx="11" fill="#0F172A" stroke="#334155"/><text x="59" y="127" text-anchor="middle" fill="#86EFAC" font-size="10.5">S3 build cache</text></g>
    <g transform="translate(488,258)"><rect width="212" height="150" rx="14" fill="#1E293B" stroke="#22C55E" stroke-width="2"/><text x="16" y="34" font-size="26">📣</text><text x="56" y="30" font-weight="700">G · Town crier</text><text x="56" y="47" fill="#94A3B8" font-size="11">15 min · recommended</text><text x="16" y="78" fill="#CBD5E1" font-size="11.5">An email every time your build</text><text x="16" y="94" fill="#CBD5E1" font-size="11.5">goes red. Nobody watches a console.</text><rect x="16" y="112" width="112" height="22" rx="11" fill="#0F172A" stroke="#334155"/><text x="72" y="127" text-anchor="middle" fill="#86EFAC" font-size="10.5">EventBridge · SNS</text></g>
    <g transform="translate(716,258)"><rect width="212" height="150" rx="14" fill="#1E293B" stroke="#22C55E" stroke-width="2"/><text x="16" y="34" font-size="26">🔎</text><text x="56" y="30" font-weight="700">H · Log detective</text><text x="56" y="47" fill="#94A3B8" font-size="11">10 min · bonus</text><text x="16" y="78" fill="#CBD5E1" font-size="11.5">Query every build you ran today</text><text x="16" y="94" fill="#CBD5E1" font-size="11.5">with one Logs Insights query.</text><rect x="16" y="112" width="128" height="22" rx="11" fill="#0F172A" stroke="#334155"/><text x="80" y="127" text-anchor="middle" fill="#86EFAC" font-size="10.5">CloudWatch Logs Insights</text></g>
  </g>
  <text x="32" y="446" fill="#64748B" font-size="12">Blue = build fundamentals · Amber = a real bug hunt · Green = a new AWS service wired into the build.  All eight ≈ 90 minutes; the four “recommended” ≈ 50.</text>
</svg>
