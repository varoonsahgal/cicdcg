<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs>
  <rect width="960" height="350" rx="18" fill="#0B1220"/>
  <text x="32" y="42" fill="#E2E8F0" font-size="20" font-weight="700">Who are you, and what may you do? IAM authenticates, Kubernetes authorises</text>
  <g font-size="11" text-anchor="middle">
    <g transform="translate(32,74)"><rect width="150" height="130" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/><text x="75" y="24" fill="#FCD34D" font-size="12.5" font-weight="700">IAM user</text><text x="75" y="40" fill="#E2E8F0" font-family="ui-monospace,Menlo,monospace" font-size="10.5">participant-NN</text><text x="75" y="66" fill="#CBD5E1">aws eks get-token</text><text x="75" y="82" fill="#94A3B8" font-size="10.5">signs a 15-minute token</text><text x="75" y="98" fill="#94A3B8" font-size="10.5">with your IAM credentials</text><text x="75" y="120" fill="#64748B" font-size="10">kubeconfig holds no secret</text></g>
    <g transform="translate(214,74)"><rect width="176" height="130" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/><text x="88" y="24" fill="#FCD34D" font-size="12.5" font-weight="700">EKS access entry</text><text x="88" y="46" fill="#CBD5E1">principal ARN</text><text x="88" y="60" fill="#E2E8F0" font-family="ui-monospace,Menlo,monospace" font-size="10">arn:…:user/participant-NN</text><text x="88" y="84" fill="#CBD5E1">kubernetes groups</text><text x="88" y="98" fill="#E2E8F0" font-family="ui-monospace,Menlo,monospace" font-size="10">[participant-NN]</text><text x="88" y="120" fill="#64748B" font-size="10">made by the instructor</text></g>
    <g transform="translate(422,74)"><rect width="176" height="130" rx="12" fill="#1E293B" stroke="#A78BFA" stroke-width="2"/><text x="88" y="24" fill="#C4B5FD" font-size="12.5" font-weight="700">RoleBinding</text><text x="88" y="40" fill="#94A3B8" font-size="10.5">in namespace participant-NN</text><text x="88" y="64" fill="#CBD5E1">subject: Group participant-NN</text><text x="88" y="80" fill="#CBD5E1">roleRef: Role namespace-owner</text><text x="88" y="104" fill="#64748B" font-size="10">exists only in YOUR namespace;</text><text x="88" y="118" fill="#64748B" font-size="10">that is the whole fence</text></g>
    <g transform="translate(630,74)"><rect width="150" height="130" rx="12" fill="#1E293B" stroke="#A78BFA" stroke-width="2"/><text x="75" y="24" fill="#C4B5FD" font-size="12.5" font-weight="700">Role</text><text x="75" y="40" fill="#94A3B8" font-size="10.5">namespace-owner</text><text x="75" y="64" fill="#CBD5E1">verbs: *</text><text x="75" y="80" fill="#CBD5E1">resources: *</text><text x="75" y="96" fill="#94A3B8" font-size="10">core · apps · batch</text><text x="75" y="108" fill="#94A3B8" font-size="10">autoscaling · networking</text><text x="75" y="120" fill="#94A3B8" font-size="10">policy · metrics</text></g>
    <g transform="translate(812,74)"><rect width="116" height="130" rx="12" fill="#0F172A" stroke="#334155"/><text x="58" y="24" fill="#E2E8F0" font-size="12.5" font-weight="700">Verdict</text><text x="58" y="50" fill="#86EFAC">✓ anything in</text><text x="58" y="64" fill="#86EFAC">participant-NN</text><text x="58" y="84" fill="#86EFAC">✓ get nodes</text><text x="58" y="98" fill="#94A3B8" font-size="10">(ClusterRole viewer)</text><text x="58" y="118" fill="#FCA5A5">✗ kube-system</text></g>
  </g>
  <g stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#a)"><path d="M182 139H212"/><path d="M390 139H420"/><path d="M598 139H628"/><path d="M780 139H810"/></g>
  <g fill="#94A3B8" font-size="9.5" text-anchor="middle"><text x="197" y="129">token</text><text x="405" y="129">group</text><text x="613" y="129">roleRef</text></g>
  <g font-size="12" fill="#CBD5E1">
    <text x="32" y="236">Read the chain yourself: <tspan font-family="ui-monospace,Menlo,monospace" fill="#C4B5FD">kubectl auth can-i --list</tspan> · <tspan font-family="ui-monospace,Menlo,monospace" fill="#C4B5FD">kubectl get rolebinding namespace-owner -o yaml</tspan></text>
    <text x="32" y="256"><tspan font-family="ui-monospace,Menlo,monospace" fill="#C4B5FD">kubectl describe role namespace-owner</tspan> · <tspan font-family="ui-monospace,Menlo,monospace" fill="#C4B5FD">kubectl get clusterrolebinding cicd-lab5-viewer -o yaml</tspan></text>
    <text x="32" y="286">Deny by default: every ✓ is an explicit rule somewhere. A Forbidden message names <tspan fill="#fff">who</tspan>, <tspan fill="#fff">verb</tspan>, <tspan fill="#fff">resource</tspan> and <tspan fill="#fff">namespace</tspan>,</text>
    <text x="32" y="304">exactly like an IAM AccessDenied names role, action and ARN. Read it as a sentence; fix exactly that.</text>
    <text x="32" y="334" fill="#64748B" font-size="11.5">Two systems, one identity. Fixing a Forbidden never involves IAM; fixing an Unauthorized never involves RBAC.</text>
  </g>
</svg>
