<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs>
  <rect width="960" height="440" rx="18" fill="#0B1220"/>
  <text x="32" y="42" fill="#E2E8F0" font-size="20" font-weight="700">Lab 3 · the Pipeline Repair Shop · everything you were handed</text>
  <g font-size="12" text-anchor="middle">
    <g transform="translate(32,90)"><rect width="150" height="130" rx="14" fill="#1E293B" stroke="#334155"/><text x="75" y="26" fill="#E2E8F0" font-weight="700">S3 bucket</text><text x="75" y="44" fill="#94A3B8" font-size="11">cicd-lab3-participant-NN-…</text><rect x="14" y="58" width="122" height="28" rx="7" fill="#0F172A" stroke="#475569"/><text x="75" y="76" fill="#93C5FD" font-size="11" font-family="ui-monospace,Menlo,monospace">source/app.zip</text><text x="75" y="106" fill="#94A3B8" font-size="11">+ pipeline artifacts</text></g>
    <g transform="translate(222,90)"><rect width="190" height="130" rx="14" fill="#1E293B" stroke="#334155"/><text x="95" y="26" fill="#E2E8F0" font-weight="700">CodeBuild project</text><text x="95" y="44" fill="#94A3B8" font-size="11">cicd-lab3-participant-NN-build</text><text x="95" y="68" fill="#CBD5E1" font-size="11">runs buildspec.yml</text><text x="95" y="84" fill="#CBD5E1" font-size="11">stamps build # into index.html</text><text x="95" y="100" fill="#CBD5E1" font-size="11">packages the artifact</text><text x="95" y="118" fill="#94A3B8" font-size="11">role: …-codebuild-role</text></g>
    <g transform="translate(452,90)"><rect width="190" height="130" rx="14" fill="#1E293B" stroke="#334155"/><text x="95" y="26" fill="#E2E8F0" font-weight="700">CodeDeploy</text><text x="95" y="44" fill="#94A3B8" font-size="11">app …-app · group …-group</text><text x="95" y="68" fill="#CBD5E1" font-size="11">finds instances by tag</text><text x="95" y="84" fill="#CBD5E1" font-size="11">Name = ?</text><text x="95" y="100" fill="#CBD5E1" font-size="11">runs appspec hooks</text><text x="95" y="118" fill="#86EFAC" font-size="11">role: …-codedeploy-role ✔</text></g>
    <g transform="translate(682,90)"><rect width="246" height="130" rx="14" fill="#1E293B" stroke="#334155"/><text x="123" y="26" fill="#E2E8F0" font-weight="700">EC2 instance</text><text x="123" y="44" fill="#94A3B8" font-size="11">Name = cicd-lab3-participant-NN-web</text><text x="123" y="68" fill="#CBD5E1" font-size="11">CodeDeploy agent pre-installed ✔</text><text x="123" y="84" fill="#CBD5E1" font-size="11">Apache will be installed by a hook</text><text x="123" y="100" fill="#CBD5E1" font-size="11">http://&lt;public ip&gt;/</text><text x="123" y="118" fill="#94A3B8" font-size="11">role: …-ec2-role</text></g>
  </g>
  <g transform="translate(32,250)"><rect width="896" height="56" rx="12" fill="#0F172A" stroke="#2563EB" stroke-width="2"/><text x="448" y="24" fill="#93C5FD" font-size="13" text-anchor="middle" font-weight="700">CodePipeline · cicd-lab3-participant-NN-pipeline · Source → Build → Deploy · polls S3 for new versions</text><text x="448" y="44" fill="#64748B" font-size="11" text-anchor="middle">role: …-codepipeline-role ✔ · every upload of source/app.zip starts a new execution within ~1 minute</text></g>
  <g stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#a)"><path d="M182 155H220"/><path d="M412 155H450"/><path d="M642 155H680"/></g>
  <g font-size="12" fill="#CBD5E1"><text x="32" y="340" font-weight="700" fill="#FCD34D">Six bugs are hidden in this picture.</text><text x="32" y="362">Two are in files inside app.zip · two are IAM permissions · one is a CodeDeploy setting · one is “it says green but it is wrong”.</text><text x="32" y="384">Fix them one at a time, in whatever order the pipeline reveals them. ✔ = this part is known-good; start your suspicion elsewhere.</text><text x="32" y="408" fill="#64748B">Rules: stay inside your own participant-NN resources · you may edit files, IAM role policies, the deployment group and instance tags.</text><text x="32" y="426" fill="#64748B">Do not change the pipeline definition itself.</text></g>
</svg>
