<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60A5FA"/></marker></defs>
  <rect width="960" height="360" rx="18" fill="#0B1220"/>
  <text x="32" y="42" fill="#E2E8F0" font-size="20" font-weight="700">Three robots, three identities · who is allowed to touch what</text>
  <g font-size="12" text-anchor="middle">
    <g transform="translate(40,80)"><rect width="260" height="200" rx="14" fill="#1E293B" stroke="#334155"/><text x="130" y="28" fill="#E2E8F0" font-size="14" font-weight="700">🧭 CodePipeline</text><rect x="18" y="44" width="224" height="34" rx="8" fill="#172554" stroke="#3B82F6"/><text x="130" y="66" fill="#BFDBFE" font-size="11">role: AWSCodePipelineServiceRole-…</text><text x="130" y="104" fill="#CBD5E1">reads the source object</text><text x="130" y="124" fill="#CBD5E1">writes/reads the artifact store</text><text x="130" y="144" fill="#CBD5E1">codebuild:StartBuild</text><text x="130" y="164" fill="#CBD5E1">codedeploy:CreateDeployment</text><text x="130" y="188" fill="#64748B" font-size="11">made by the wizard</text></g>
    <g transform="translate(350,80)"><rect width="260" height="200" rx="14" fill="#1E293B" stroke="#334155"/><text x="130" y="28" fill="#E2E8F0" font-size="14" font-weight="700">🚚 CodeDeploy (the service)</text><rect x="18" y="44" width="224" height="34" rx="8" fill="#172554" stroke="#3B82F6"/><text x="130" y="66" fill="#BFDBFE" font-size="10">role: participant-NN-codedeploy-service-role</text><text x="130" y="104" fill="#CBD5E1">ec2:DescribeInstances (find by tag)</text><text x="130" y="124" fill="#CBD5E1">tags, Auto Scaling, ELB hooks</text><text x="130" y="144" fill="#CBD5E1">policy: AWSCodeDeployRole</text><text x="130" y="188" fill="#64748B" font-size="11">it never touches your files itself</text></g>
    <g transform="translate(660,80)"><rect width="260" height="200" rx="14" fill="#1E293B" stroke="#334155"/><text x="130" y="28" fill="#E2E8F0" font-size="14" font-weight="700">🖥️ EC2 instance (the agent)</text><rect x="18" y="44" width="224" height="34" rx="8" fill="#172554" stroke="#3B82F6"/><text x="130" y="66" fill="#BFDBFE" font-size="10">role: participant-NN-ec2-codedeploy-role</text><text x="130" y="104" fill="#CBD5E1">s3:GetObject on the bundle</text><text x="130" y="124" fill="#CBD5E1">(AmazonEC2RoleforAWSCodeDeploy)</text><text x="130" y="144" fill="#CBD5E1">ssm:* for Session Manager</text><text x="130" y="188" fill="#64748B" font-size="11">attached via an instance profile</text></g>
  </g>
  <g stroke="#60A5FA" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M300 180H348"/><path d="M610 180H658"/></g>
  <text x="325" y="170" fill="#93C5FD" font-size="11" text-anchor="middle">“deploy this”</text>
  <text x="635" y="170" fill="#93C5FD" font-size="11" text-anchor="middle">“go fetch it”</text>
  <text x="480" y="318" fill="#FCD34D" font-size="13" text-anchor="middle">Debugging rule: find which robot was acting when it failed, then ask whether THAT robot's role allows it.</text>
  <text x="480" y="340" fill="#64748B" font-size="11" text-anchor="middle">Your own user (participant-NN) only needs permission to create and look at things. It is never used at run time.</text>
</svg>
